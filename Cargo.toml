[package]
name = "fec-receipt"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
fec-parser = { git = "https://github.com/asg017/libfec", branch = "typed-covers" }  # PRs asg017/libfec#30-#38
anyhow = "1"
deunicode = "1"
jiff = "0.2"
qrcode = { version = "0.14", default-features = false }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
clap = { version = "4", features = ["derive"] }
rusb = "0.9"
tiny_http = "0.12"
ureq = "3"

# Browser build: `make -C web`.
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "=0.2.129"  # must match the installed wasm-bindgen-cli

[dev-dependencies]
insta = "1"

# Smaller browser bundle: `make -C web` builds with this.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
