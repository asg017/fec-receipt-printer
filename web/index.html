<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FEC Receipt</title>
<style id="paper-css"></style>
<style>
:root { --bg: #e7e5e0; --fg: #222; --muted: #6b6b6b; --line: #cfccc4; --panel: #f4f3ef; --accent: #2563eb; --ok: #16a34a; }
@media (prefers-color-scheme: dark) { :root { --bg: #1f1f22; --fg: #e8e8e8; --muted: #9a9a9a; --line: #3a3a3f; --panel: #28282c; --accent: #7aa2ff; } }
* { box-sizing: border-box; }
body { margin: 0; display: flex; min-height: 100vh; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
aside { width: 280px; flex: none; padding: 16px; border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 12px; }
h1 { font-size: 15px; margin: 0; }
label { display: flex; gap: 6px; align-items: center; }
button { padding: 6px 12px; font: inherit; border-radius: 6px; border: 1px solid var(--line); background: var(--accent); color: #fff; cursor: pointer; }
button.secondary { background: transparent; color: var(--fg); }
button[disabled] { background: var(--line); color: var(--muted); cursor: not-allowed; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #9ca3af; flex: none; }
.dot.on { background: var(--ok); }
.stats { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; }
.stats dt { color: var(--muted); } .stats dd { margin: 0; font-variant-numeric: tabular-nums; }
.note { color: var(--muted); font-size: 13px; margin: 0; }
.warn { background: #fef3c7; color: #78350f; padding: 8px; border-radius: 6px; }
.err { color: #dc2626; white-space: pre-wrap; }
.samples { display: flex; flex-wrap: wrap; gap: 4px; border-top: 1px solid var(--line); padding-top: 12px; }
.samples button { font: 12px ui-monospace, monospace; padding: 2px 6px; background: transparent; color: var(--fg); }
.samples button.cur, .samples button:hover { border-color: var(--accent); color: var(--accent); }
main { flex: 1; padding: 32px 16px; display: flex; flex-direction: column; align-items: center; min-width: 0; }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 48px 24px; text-align: center; color: var(--muted); max-width: 420px; }
body.dragging main { outline: 3px dashed var(--accent); outline-offset: -12px; }
@media (max-width: 720px) { body { flex-direction: column; } aside { width: auto; border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<aside>
  <h1>FEC receipt</h1>
  <div class="row">
    <button id="choose" class="secondary">Open .fec file…</button>
    <input id="file" type="file" accept=".fec" hidden>
  </div>
  <label><input type="checkbox" id="full"> full detail</label>
  <label><input type="checkbox" id="grid"> column grid</label>
  <dl class="stats" id="stats" hidden></dl>
  <div id="warnings"></div>
  <div class="row">
    <button id="print" disabled>Print</button>
    <span class="dot" id="dot"></span><span id="printer">printer not connected</span>
  </div>
  <button id="connect" class="secondary">Connect printer…</button>
  <p class="note" id="usb-note"></p>
  <nav class="samples" id="samples"></nav>
</aside>
<main id="main">
  <div class="drop">Drop a <code>.fec</code> file anywhere, open one, or pick a sample.</div>
</main>

<script type="module">
import init, { render, paper_css } from './pkg/fec_receipt.js';

// The POS58: USB 0416:5011, bulk OUT endpoint 0x03 (see src/usb.rs).
const PRINTER = { vendorId: 0x0416, productId: 0x5011 };
const SAMPLES = ['F3XN_1926068', 'F3PA_1863008', 'F24N_1900131', 'F99_1945322', 'F1N_1906351'];

const $ = (id) => document.getElementById(id);
let current = null;   // { bytes: Uint8Array, name }
let rendered = null;  // last render's ESC/POS bytes
let device = null;

await init();
$('paper-css').textContent = paper_css();

// --- loading and rendering -------------------------------------------------

function show() {
  if (!current) return;
  const main = $('main');
  try {
    const r = render(current.bytes, current.name, $('full').checked);
    rendered = r.escpos;
    main.innerHTML = r.html;
    $('stats').hidden = false;
    $('stats').innerHTML = `<dt>File</dt><dd>${esc(current.name)}</dd>`
      + `<dt>Paper</dt><dd>~${Math.round(r.length_mm)} mm</dd>`
      + `<dt>Bytes</dt><dd>${rendered.length}</dd>`;
    const w = r.warnings;
    $('warnings').innerHTML = w.length
      ? `<div class="warn"><b>Warnings</b><ul>${w.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : '';
    r.free();
  } catch (e) {
    rendered = null;
    main.innerHTML = `<pre class="err">${esc(String(e.message ?? e))}</pre>`;
  }
  for (const b of $('samples').children) b.classList.toggle('cur', b.dataset.name === current.name);
  updatePrinter();
}

async function load(blob, name) {
  current = { bytes: new Uint8Array(await blob.arrayBuffer()), name };
  show();
}

$('choose').onclick = () => $('file').click();
$('file').onchange = (e) => { const f = e.target.files[0]; if (f) load(f, f.name); };
$('full').onchange = show;

let grid = false;
try { grid = localStorage.getItem('grid') === '1'; } catch {}
$('grid').checked = grid;
document.body.classList.toggle('grid', grid);
$('grid').onchange = () => {
  document.body.classList.toggle('grid', $('grid').checked);
  try { localStorage.setItem('grid', $('grid').checked ? '1' : '0'); } catch {}
};

let depth = 0;
addEventListener('dragenter', (e) => { e.preventDefault(); depth++; document.body.classList.add('dragging'); });
addEventListener('dragleave', () => { if (--depth === 0) document.body.classList.remove('dragging'); });
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('drop', (e) => {
  e.preventDefault();
  depth = 0;
  document.body.classList.remove('dragging');
  const f = e.dataTransfer.files[0];
  if (f) load(f, f.name);
});

for (const name of SAMPLES) {
  const b = document.createElement('button');
  b.textContent = name;
  b.dataset.name = `${name}.fec`;
  b.onclick = () => { location.hash = name; };
  $('samples').append(b);
}

// `#F3XN_1926068` opens that sample, so a sample view can be linked.
async function loadSample() {
  const name = decodeURIComponent(location.hash.slice(1));
  if (!SAMPLES.includes(name)) return;
  load(await (await fetch(`samples/${name}.fec`)).blob(), `${name}.fec`);
}
addEventListener('hashchange', loadSample);
loadSample();

// --- printing over WebUSB --------------------------------------------------

function updatePrinter() {
  $('dot').classList.toggle('on', !!device);
  $('printer').textContent = device ? 'printer connected' : 'printer not connected';
  $('print').disabled = !(device && rendered);
  $('connect').hidden = !!device;
}

if (!navigator.usb) {
  $('connect').disabled = true;
  $('usb-note').textContent = window.isSecureContext
    ? 'This browser has no WebUSB. Use Chrome or Edge to print.'
    : 'WebUSB needs https or localhost.';
} else {
  // A printer allowed on an earlier visit reconnects without a prompt.
  [device] = await navigator.usb.getDevices();
  navigator.usb.addEventListener('connect', (e) => { device ??= e.device; updatePrinter(); });
  navigator.usb.addEventListener('disconnect', (e) => { if (e.device === device) device = null; updatePrinter(); });
  $('connect').onclick = async () => {
    try {
      device = await navigator.usb.requestDevice({ filters: [PRINTER] });
    } catch { /* picker cancelled */ }
    updatePrinter();
  };
}
updatePrinter();

$('print').onclick = async () => {
  const button = $('print');
  button.disabled = true;
  button.textContent = 'Printing…';
  try {
    await sendToPrinter(device, rendered);
    $('usb-note').textContent = '';
  } catch (e) {
    $('usb-note').textContent = `Print failed: ${e.message ?? e}`;
  } finally {
    button.textContent = 'Print';
    updatePrinter();
  }
};

async function sendToPrinter(dev, bytes) {
  await dev.open();
  try {
    if (dev.configuration === null) await dev.selectConfiguration(1);
    const iface = dev.configuration.interfaces[0];
    await dev.claimInterface(iface.interfaceNumber);
    try {
      // The bulk OUT endpoint: 0x03 on the POS58, but ask rather than assume.
      const out = iface.alternate.endpoints.find((ep) => ep.direction === 'out' && ep.type === 'bulk');
      const ep = out ? out.endpointNumber : 3;
      for (let i = 0; i < bytes.length; i += 1024) {
        const r = await dev.transferOut(ep, bytes.subarray(i, i + 1024));
        if (r.status !== 'ok') throw new Error(`USB transfer ${r.status}`);
      }
    } finally {
      await dev.releaseInterface(iface.interfaceNumber);
    }
  } finally {
    await dev.close();
  }
}

function esc(s) {
  return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
}
</script>
</body>
</html>
